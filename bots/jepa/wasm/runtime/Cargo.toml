[package]
name = "jepa-wasi"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]

[dependencies]
jepa-controller = { path = "../controller" }
serde_json = "=1.0.154"

[features]
diagnostics = []
# Research graph only; the default continues to embed the original graph and checkpoints.
own-deck = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
