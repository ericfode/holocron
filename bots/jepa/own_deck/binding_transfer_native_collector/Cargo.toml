[package]
# Retains the saved probe's package/dependency identity so its immutable lockfile
# can be reused without a resolver invocation. The executable is separate.
name = "jepa-kessel-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "binding-transfer-native-collector"
path = "src/main.rs"

[[bin]]
name = "binding-transfer-fixture-validator"
path = "src/fixture_validator.rs"

[dependencies]
kessel = { path = "/Users/ericfode/Documents/Codex/2026-10-17/task-5/kessel-pilot-source/crates/kessel" }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 0
debug = 0
incremental = false
